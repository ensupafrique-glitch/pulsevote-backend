name: Staging Deploy Executable
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_NEW }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run test:e2e
      - run: echo "Deploy backend to staging infrastructure"
