name: Staging Deploy Executable
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run test:e2e
      - run: echo "Deploy backend to staging infrastructure"
        - run: npm install
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run test:e2e
      - run: echo "Deploy backend to staging infrastructure"
